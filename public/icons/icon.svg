<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ReyonStok">
  <!--
    Uygulama ikonu kaynağı.

    İşaret, karekodun konum belirleme deseni (finder pattern): 7x7 modül, modül
